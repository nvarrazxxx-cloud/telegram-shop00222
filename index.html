<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STREET STYLE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--surf:#171717;--line:#2a2a2a;--tx:#fff;--mut:#929292;--ac:#FF6B1A;--on-ac:#0B0B0B;--tone1:#1f1f1f;--tone2:#262626;--tone3:#171717;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F4F4F2;--surf:#fff;--line:#dcdcd8;--tx:#0B0B0B;--mut:#5f5f5f;--tone1:#e9e9e5;--tone2:#dfdfda;--tone3:#f0f0ed;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;padding-bottom:84px;overflow-x:hidden}
h1,h2,h3{font-family:Unbounded,Inter,system-ui,sans-serif;margin:0;line-height:1.05}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:720px;margin:0 auto}
.logo{font:900 17px Unbounded,sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:14px;height:14px;background:var(--ac);display:block;transform:rotate(45deg)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(38px,12vw,72px);font-weight:900;letter-spacing:-.04em;text-transform:uppercase}
.hero h1 span{display:inline-block;background:var(--ac);color:var(--on-ac);padding:0 .12em;margin-top:.06em}
.hero p{color:var(--mut);max-width:34ch;margin:18px 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:12px;background:var(--ac);color:var(--on-ac);font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surf);color:var(--tx);border:1px solid var(--line)}
.btn.block{width:100%}
h2{font-size:20px;font-weight:600;margin:34px 0 14px;letter-spacing:-.02em}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--surf);border:1px solid var(--line);color:var(--mut);font-weight:500}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{cursor:pointer}
.art{position:relative;aspect-ratio:4/5;border-radius:14px;background:var(--tone1);display:grid;place-items:center;overflow:hidden}
.art svg.g{width:68%;height:68%}
.fav{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--tx);background:var(--bg)}
.fav.on{color:var(--ac)}.fav.on .ic{fill:var(--ac)}
.tag{position:absolute;left:8px;top:8px;background:var(--ac);color:var(--on-ac);font:600 11px Inter;padding:4px 8px;border-radius:6px}
.card h3{font:500 14px Inter;margin:10px 0 2px}
.pr{margin:0;font-weight:600}
.srch{display:flex;gap:8px;margin:6px 0 12px}
.srch input,.srch select,.fld input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surf);padding:0 14px;width:100%}
.srch select{width:auto;flex:none}
.facts{display:grid;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.facts div{background:var(--surf);padding:16px}
.facts b{display:block;font-weight:600;margin-bottom:2px}
.facts span,.mut{color:var(--mut)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .art{flex:none;width:100%;scroll-snap-align:center}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sz{min-width:56px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:600;transition:transform .15s,background .15s}
.sz.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac);transform:scale(1.06)}
.sz:disabled{color:var(--mut);opacity:.5;text-decoration:line-through;cursor:not-allowed}
.back{height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--mut)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
.nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:11px}
.nav button.on{color:var(--ac)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet>form{background:var(--surf);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
.sum{background:var(--bg);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.err{color:#ff6b6b;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;z-index:20;max-width:90%;animation:up .2s}
.empty{padding:40px 0;text-align:center;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="logo"><i></i>STREET STYLE</div><button id="topfav" class="back" aria-label="Избранное"></button></div>
<main id="app" class="wrap"></main>
<nav class="nav" id="nav"></nav>
<script>
var CATS=[['all','Все товары'],['jeans','Джинсы'],['shoes','Обувь'],['tees','Футболки'],['hoodies','Худи'],['pants','Штаны'],['jackets','Куртки'],['acc','Аксессуары']];
var P=[
{id:1,sku:'SS-JN-001',name:'Джинсы Baggy Black',cat:'jeans',price:24900,color:'Чёрный',hex:'#2b2b2b',sizes:{S:2,M:5,L:0,XL:3},nw:1,pop:1,d:'Свободный крой, плотный деним 12 унций, заниженная посадка.'},
{id:2,sku:'SS-HD-014',name:'Худи Oversize Graphite',cat:'hoodies',price:21900,color:'Графит',hex:'#4a4a4a',sizes:{S:0,M:4,L:6,XL:2},nw:0,pop:1,d:'Футер с начёсом, объёмный капюшон, прямой низ.'},
{id:3,sku:'SS-TE-007',name:'Футболка Heavy Tee',cat:'tees',price:9900,color:'Белый',hex:'#e8e8e8',sizes:{S:5,M:8,L:7,XL:0},nw:1,pop:0,d:'Хлопок 240 г/м², удлинённый силуэт, плотный ворот.'},
{id:4,sku:'SS-SH-021',name:'Кроссовки Rail Low',cat:'shoes',price:38900,color:'Серый',hex:'#8a8a8a',sizes:{40:1,41:3,42:4,43:0,44:2},nw:1,pop:1,d:'Рельефная подошва, дышащая сетка, усиленный носок.'},
{id:5,sku:'SS-PN-009',name:'Штаны Cargo Wide',cat:'pants',price:19900,color:'Хаки',hex:'#6b6b4a',sizes:{S:3,M:0,L:4,XL:4},nw:0,pop:0,d:'Широкие карго с боковыми карманами и утяжкой по низу.'},
{id:6,sku:'SS-JK-003',name:'Куртка Coach Jacket',cat:'jackets',price:32900,color:'Чёрный',hex:'#1c1c1c',sizes:{S:2,M:2,L:3,XL:1},nw:1,pop:1,d:'Лёгкая куртка на кнопках, ветрозащитная ткань.'},
{id:7,sku:'SS-AC-002',name:'Кепка Five Panel',cat:'acc',price:6900,color:'Оранжевый',hex:'#FF6B1A',sizes:{ONE:12},nw:0,pop:0,d:'Пятипанельная кепка, регулируемый ремешок.'},
{id:8,sku:'SS-HD-016',name:'Худи Zip Black',cat:'hoodies',price:23900,color:'Чёрный',hex:'#202020',sizes:{S:1,M:3,L:0,XL:0},nw:0,pop:0,d:'Молния на всю длину, плотный футер, манжеты с резинкой.'}];
var SH={tees:'M30 18L42 14Q50 24 58 14L70 18L90 36L80 48L70 42V86H30V42L20 48L10 36Z',hoodies:'M28 22L40 14Q50 30 60 14L72 22L92 62L82 68L72 48V88H28V48L18 68L8 62Z',jackets:'M28 20L42 14L50 20L58 14L72 20L92 60L82 66L72 46V88H28V46L18 66L8 60Z',jeans:'M30 12H70L76 90H55L50 42L45 90H24Z',pants:'M28 12H72L80 90H56L50 40L44 90H20Z',shoes:'M8 66V50Q28 48 38 34L52 42Q62 54 92 56Q96 60 92 70H10Z',acc:'M20 62Q22 30 50 28Q78 30 80 62ZM70 60H96V67H70Z'};
var DEF_CODE='';
var st={v:'home',cat:'all',q:'',sort:'pop',fav:[],pid:null,size:null,wa:''};
try{st.fav=JSON.parse(localStorage.getItem('ss_fav')||'[]');st.wa=localStorage.getItem('ss_wa')||''}catch(e){}
var $=function(s){return document.querySelector(s)};
var fmt=function(n){return n.toLocaleString('ru-RU')+' ₸'};
var I={home:'<path d="M4 11l8-7 8 7v9H4z"/>',cat:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',heart:'<path d="M12 20s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.400-7 10-7 10z"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/>',back:'<path d="M15 5l-7 7 7 7"/>',wa:'<path d="M4 20l1.300-4.200A8 8 0 118 19z"/>'};
var ic=function(k){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+I[k]+'</svg>'};
function art(p,i){var t=['var(--tone1)','var(--tone2)','var(--tone3)'][i||0],tr=['','scale(1.35) translate(-13 -10)','scale(-1 1) translate(-100 0)'][i||0];
var im=p.imgs&&p.imgs[i||0];return '<div class="art" style="background:'+t+'">'+(im?'<img src="'+im+'" alt="">':'')+'<svg class="g" style="'+(im?'display:none':'')+'" viewBox="0 0 100 100" aria-hidden="true"><g transform="'+tr+'"><path d="'+SH[p.cat]+'" fill="'+p.hex+'" stroke="rgba(255,255,255,.18)" stroke-width="1"/></g></svg>'+(i==null?'<button class="fav'+(st.fav.indexOf(p.id)>-1?' on':'')+'" data-fav="'+p.id+'" aria-label="В избранное">'+ic('heart')+'</button>'+(p.nw?'<span class="tag">Новинка</span>':''):'')+'</div>'}
function card(p){return '<article class="card" data-id="'+p.id+'">'+art(p)+'<h3>'+p.name+'</h3><p class="pr">'+fmt(p.price)+'</p></article>'}
function toast(m){var e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2400)}
function go(v,x){st.v=v;if(x!==undefined)st.pid=x;st.size=null;render();window.scrollTo(0,0)}
function list(){var r=P.filter(function(p){return(st.cat=='all'||p.cat==st.cat)&&p.name.toLowerCase().indexOf(st.q.toLowerCase())>-1});
if(st.sort=='asc')r.sort(function(a,b){return a.price-b.price});else if(st.sort=='desc')r.sort(function(a,b){return b.price-a.price});else r.sort(function(a,b){return b.pop-a.pop});return r}
function render(){var h='',v=st.v;
$('#nav').innerHTML=[['home','Главная','home'],['catalog','Каталог','cat'],['favs','Избранное','heart'],['settings','Настройки','set']].map(function(n){return '<button data-go="'+n[0]+'" class="'+(v==n[0]||(v=='product'&&n[0]=='catalog')?'on':'')+'">'+ic(n[2])+n[1]+'</button>'}).join('');
$('#topfav').innerHTML=ic('heart')+(st.fav.length?st.fav.length:'');
if(v=='home'){h='<section class="hero"><h1>Уличный<br><span>стиль</span><br>для всех</h1><p>Одежда и обувь с доставкой по всему Казахстану. Выбирайте размер, мы подтвердим наличие в WhatsApp.</p><button class="btn" data-go="catalog">Смотреть каталог</button></section>'
+'<h2>Категории</h2><div class="row">'+CATS.slice(1).map(function(c){return '<button class="chip" data-cat="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>'
+'<h2>Популярное</h2><div class="grid">'+P.filter(function(p){return p.pop}).slice(0,4).map(card).join('')+'</div>'
+'<h2>Новинки</h2><div class="grid">'+P.filter(function(p){return p.nw}).slice(0,4).map(card).join('')+'</div>'
+'<h2>Доставка и оплата</h2><div class="facts"><div><b>Доставка по Казахстану</b><span>Отправляем в любой город. Условия и сроки уточняем при подтверждении заказа.</span></div><div><b>Проверка наличия</b><span>Размеры и остатки видны в карточке товара.</span></div><div><b>Заказ через WhatsApp</b><span>Заказ считается принятым только после ответа магазина.</span></div></div>'
+'<h2>Контакты</h2><p class="mut">'+(st.wa?'WhatsApp: +'+st.wa:'Номер WhatsApp не настроен. Добавьте его в настройках.')+'</p>'}
else if(v=='catalog'){h='<h2>Каталог</h2><div class="srch"><input id="q" type="search" placeholder="Поиск по названию" value="'+st.q+'" aria-label="Поиск"><select id="sort" aria-label="Сортировка"><option value="pop">Популярные</option><option value="asc">Дешевле</option><option value="desc">Дороже</option></select></div><div class="row" style="margin-bottom:16px">'+CATS.map(function(c){return '<button class="chip'+(st.cat==c[0]?' on':'')+'" data-cat="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>'+gridOf(list())}
else if(v=='favs'){h='<h2>Избранное</h2>'+gridOf(P.filter(function(p){return st.fav.indexOf(p.id)>-1}),'Нажмите на сердечко у товара, чтобы сохранить его здесь.')}
else if(v=='settings'){h='<h2>Настройки</h2><button class="btn ghost block" data-go="admin" style="margin-bottom:16px">Панель администратора</button><label class="fld"><span>Номер WhatsApp магазина (с кодом страны, без плюса)</span><input id="wa" inputmode="numeric" placeholder="Например, код страны и номер" value="'+st.wa+'"></label><button class="btn block" id="savewa">Сохранить номер</button><p class="mut">В этом прототипе номер хранится только в вашем браузере. В боевой версии он лежит в базе, а доступ к настройкам закрыт кодом администратора, который проверяет сервер.</p>'}
else if(v=='product'){var p=P.filter(function(x){return x.id==st.pid})[0];h='<button class="back" data-go="catalog">'+ic('back')+'Назад</button><div class="gal">'+(p.imgs&&p.imgs.length?p.imgs:[0,1,2]).map(function(q,i){return art(p,i)}).join('')+'</div><h2 style="margin-top:18px">'+p.name+'</h2><p class="pr" style="font-size:20px">'+fmt(p.price)+'</p><p class="mut">Артикул '+p.sku+'. Цвет: '+p.color+'.</p><p>'+p.d+'</p><h2 style="font-size:16px">Размер</h2><div class="sizes">'+Object.keys(p.sizes).map(function(s){var n=p.sizes[s];return '<button class="sz'+(st.size==s?' on':'')+'" data-size="'+s+'"'+(n?'':' disabled aria-label="Размер '+s+' недоступен"')+'>'+s+'</button>'}).join('')+'</div><p class="mut">'+(st.size?(p.sizes[st.size]<=2?'Осталось '+p.sizes[st.size]+' шт.':'В наличии'):'Выберите размер, чтобы оформить заказ. Зачёркнутых размеров сейчас нет.')+'</p><div style="height:70px"></div><div class="cta"><button class="btn block" id="order">Заказать</button></div>'}
$('#app').innerHTML=h;document.querySelector('.nav').style.display=v=='product'?'none':'flex'}
function gridOf(a,msg){return a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<p class="empty">'+(msg||'Ничего не найдено. Измените запрос или категорию.')+'</p>'}
function sheet(){var p=P.filter(function(x){return x.id==st.pid})[0],d=document.createElement('div');d.className='sheet';
d.innerHTML='<form novalidate><h2 style="margin-top:0">Оформление заказа</h2><p class="sum"><b>'+p.name+'</b><br><span class="mut">Артикул '+p.sku+', размер '+st.size+'</span><br><b>'+fmt(p.price)+'</b></p><label class="fld"><span>Имя</span><input name="n" autocomplete="name"></label><label class="fld"><span>Город</span><input name="c" autocomplete="address-level2"></label><label class="fld"><span>Адрес доставки</span><input name="a" autocomplete="street-address"></label><label class="fld"><span>Почтовый индекс</span><input name="z" inputmode="numeric" autocomplete="postal-code"></label><label class="fld"><span>Телефон</span><input name="t" type="tel" autocomplete="tel"></label><p class="err" id="err" role="alert" hidden></p><button class="btn block" type="submit">'+ic('wa')+'Перейти в WhatsApp</button><button class="btn ghost block" type="button" id="cl" style="margin-top:8px">Отмена</button></form>';
document.body.appendChild(d);d.querySelector('input').focus();
d.querySelector('#cl').onclick=function(){d.remove()};d.onclick=function(e){if(e.target==d)d.remove()};
d.querySelector('form').onsubmit=function(e){e.preventDefault();var f=e.target,v=function(k){return f.elements[k].value.trim()},er=$('#err');
function bad(m){er.textContent=m;er.hidden=false}
if(!v('n')||!v('c')||!v('a')||!v('z')||!v('t'))return bad('Заполните все поля: имя, город, адрес, индекс и телефон.');
if(v('t').replace(/\D/g,'').length<10)return bad('Телефон указан неполностью. Введите номер вместе с кодом.');
var num=st.wa.replace(/\D/g,'');if(!num)return bad('Номер WhatsApp магазина не настроен. Добавьте его в настройках.');
var m='Здравствуйте! Хочу оформить заказ в STREET STYLE.\n\nТовар: '+p.name+'\nАртикул: '+p.sku+'\nРазмер: '+st.size+'\nЦена: '+p.price+' ₸\n\nИмя: '+v('n')+'\nГород: '+v('c')+'\nАдрес доставки: '+v('a')+'\nПочтовый индекс: '+v('z')+'\nТелефон: '+v('t')+'\n\nПожалуйста, подтвердите наличие и условия доставки.';
var url='https://wa.me/'+num+'?text='+encodeURIComponent(m);d.remove();toast('Открываем WhatsApp. Заказ подтвердит магазин.');window.open(url,'_blank','noopener')}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-fav],[data-go],[data-cat],[data-size],[data-id],#order,#savewa,#topfav');if(!t)return;
if(t.dataset.fav){e.stopPropagation();var id=+t.dataset.fav,i=st.fav.indexOf(id);i>-1?st.fav.splice(i,1):st.fav.push(id);try{localStorage.setItem('ss_fav',JSON.stringify(st.fav))}catch(x){}render();toast(i>-1?'Убрано из избранного':'Добавлено в избранное')}
else if(t.id=='topfav')go('favs');
else if(t.dataset.go)go(t.dataset.go);
else if(t.dataset.cat){st.cat=t.dataset.cat;go('catalog')}
else if(t.dataset.size){st.size=t.dataset.size;render()}
else if(t.dataset.id)go('product',+t.dataset.id);
